<script>
(function(){
  function markLoaded(img){ img.setAttribute('data-loaded', '1'); }
  document.addEventListener('load', function(e){
    var t = e.target;
    if (t && t.tagName === 'IMG') markLoaded(t);
  }, true);
  // Images that are already cached/complete by the time this script parsed
  // (their 'load' event fired before we could listen) should still show up.
  document.addEventListener('DOMContentLoaded', function(){
    document.querySelectorAll('img').forEach(function(img){
      if (img.complete && img.naturalWidth > 0) markLoaded(img);
    });
  });
  // React inserts most images after initial parse; a light periodic sweep
  // catches any that finished loading before their listener was attached.
  var sweeps = 0;
  var t = setInterval(function(){
    sweeps++;
    document.querySelectorAll('img:not([data-loaded])').forEach(function(img){
      if (img.complete && img.naturalWidth > 0) markLoaded(img);
    });
if (sweeps > 6) clearInterval(t);
  }, 250);
})();
</script>
<script id="design-fix-lightbox-zoom-script">
(function(){
  var CARD_CLASS = "bg-white rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-hidden flex flex-col";
  var MODAL_CLASS = "fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-sm p-4";
  var IMG_CLASS = "w-full h-full object-contain max-h-[70vh]";
  var ZOOM_MIN = 1, ZOOM_MAX = 4, DBL_SCALE = 2.5;

  var cur = { img: null, scale: 1, x: 0, y: 0 };
  var mouseDrag = null;   // {sx, sy, ox, oy}
  var touchDrag = null;   // {sx, sy, ox, oy}
  var pinch = null;       // {startDist, startScale}
  var lastTap = null;     // {t, x, y}

  function isLightboxImg(el){
    // Uses classList.contains (not an exact class-attribute match) because this same
    // element gets an "lb-zoomed"/"lb-dragging" class added by this script once zoomed -
    // an exact-string match would then stop matching its own target mid-interaction.
    return !!el && el.tagName === "IMG" &&
      el.classList.contains("object-contain") &&
      el.classList.contains("max-h-[70vh]") &&
      !!el.closest('div[class="' + MODAL_CLASS + '"]');
  }

  function ensureCur(img){
    if (img !== cur.img) {
      cur.img = img;
      cur.scale = 1; cur.x = 0; cur.y = 0;
    }
  }

  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

  function clampPan(img){
    var wrap = img.parentElement;
    if (!wrap) return;
    var baseW = img.offsetWidth, baseH = img.offsetHeight;
    var wrapW = wrap.clientWidth, wrapH = wrap.clientHeight;
    var scaledW = baseW * cur.scale, scaledH = baseH * cur.scale;
    var maxX = Math.max(0, (scaledW - wrapW) / 2);
    var maxY = Math.max(0, (scaledH - wrapH) / 2);
    cur.x = clamp(cur.x, -maxX, maxX);
    cur.y = clamp(cur.y, -maxY, maxY);
  }

  function apply(img){
    img.style.transform = "translate(" + cur.x + "px," + cur.y + "px) scale(" + cur.scale + ")";
    if (cur.scale > 1.001) {
      img.classList.add("lb-zoomed");
    } else {
      cur.scale = 1; cur.x = 0; cur.y = 0;
      img.classList.remove("lb-zoomed");
      img.style.transform = "";
    }
  }

  function zoomAt(img, newScale, clientX, clientY){
    var wrap = img.parentElement;
    var rect = wrap.getBoundingClientRect();
    var cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    var mx = clientX - cx, my = clientY - cy;
    var s0 = cur.scale, s1 = clamp(newScale, ZOOM_MIN, ZOOM_MAX);
    var ratio = s1 / (s0 || 1);
    cur.x = mx * (1 - ratio) + cur.x * ratio;
    cur.y = my * (1 - ratio) + cur.y * ratio;
    cur.scale = s1;
    clampPan(img);
    apply(img);
  }

  function toggleZoom(img, clientX, clientY){
    if (cur.scale > 1.001) {
      cur.scale = 1; cur.x = 0; cur.y = 0;
      apply(img);
    } else {
      zoomAt(img, DBL_SCALE, clientX, clientY);
    }
  }

  function dist(t0, t1){
    var dx = t1.clientX - t0.clientX, dy = t1.clientY - t0.clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  // Desktop: wheel to zoom, anchored at the cursor
  document.addEventListener("wheel", function(e){
    if (!isLightboxImg(e.target)) return;
    var img = e.target;
    ensureCur(img);
    e.preventDefault();
    var factor = Math.exp(-e.deltaY * 0.0015);
    zoomAt(img, cur.scale * factor, e.clientX, e.clientY);
  }, { passive: false });

  // Desktop: double-click to toggle zoom, anchored at the click point
  document.addEventListener("dblclick", function(e){
    if (!isLightboxImg(e.target)) return;
    var img = e.target;
    ensureCur(img);
    toggleZoom(img, e.clientX, e.clientY);
  }, false);

  // Desktop: drag to pan once zoomed in
  document.addEventListener("mousedown", function(e){
    if (!isLightboxImg(e.target)) return;
    var img = e.target;
    ensureCur(img);
    if (cur.scale <= 1.001) return;
    mouseDrag = { sx: e.clientX, sy: e.clientY, ox: cur.x, oy: cur.y, img: img };
    img.classList.add("lb-dragging");
    e.preventDefault();
  }, false);
  document.addEventListener("mousemove", function(e){
    if (!mouseDrag) return;
    cur.x = mouseDrag.ox + (e.clientX - mouseDrag.sx);
    cur.y = mouseDrag.oy + (e.clientY - mouseDrag.sy);
    clampPan(mouseDrag.img);
    apply(mouseDrag.img);
  }, false);
  document.addEventListener("mouseup", function(){
    if (mouseDrag) { mouseDrag.img.classList.remove("lb-dragging"); }
    mouseDrag = null;
  }, false);

  // Touch: pinch to zoom, single-finger drag to pan, double-tap to toggle zoom
  document.addEventListener("touchstart", function(e){
    if (!isLightboxImg(e.target)) return;
    var img = e.target;
    ensureCur(img);
    if (e.touches.length === 2) {
      pinch = { startDist: dist(e.touches[0], e.touches[1]), startScale: cur.scale };
      touchDrag = null;
      e.preventDefault();
    } else if (e.touches.length === 1) {
      pinch = null;
      var t = e.touches[0];
      if (cur.scale > 1.001) {
        touchDrag = { sx: t.clientX, sy: t.clientY, ox: cur.x, oy: cur.y, img: img };
      }
    }
  }, { passive: false });

  document.addEventListener("touchmove", function(e){
    if (!isLightboxImg(e.target)) return;
    if (pinch && e.touches.length === 2) {
      e.preventDefault();
      var d = dist(e.touches[0], e.touches[1]);
      var factor = d / (pinch.startDist || 1);
      var mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      var my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      zoomAt(e.target, pinch.startScale * factor, mx, my);
    } else if (touchDrag && e.touches.length === 1) {
      e.preventDefault();
      var t = e.touches[0];
      cur.x = touchDrag.ox + (t.clientX - touchDrag.sx);
      cur.y = touchDrag.oy + (t.clientY - touchDrag.sy);
      clampPan(touchDrag.img);
      apply(touchDrag.img);
    }
  }, { passive: false });

  document.addEventListener("touchend", function(e){
    if (!isLightboxImg(e.target)) return;
    var wasPinching = !!pinch;
    if (e.touches.length < 2) pinch = null;
    if (e.touches.length === 0) {
      var wasTouchDrag = touchDrag;
      touchDrag = null;
      var t = e.changedTouches[0];
      // A finger that barely moved still counts as a tap even if it technically started a
      // drag (relevant once already zoomed in, where every touch arms panning immediately).
      var movedFar = false;
      if (wasTouchDrag) {
        var dx = t.clientX - wasTouchDrag.sx, dy = t.clientY - wasTouchDrag.sy;
        movedFar = Math.sqrt(dx * dx + dy * dy) > 10;
      }
      if (!wasPinching && !movedFar) {
        var now = Date.now();
        if (lastTap && now - lastTap.t < 350 &&
            Math.abs(t.clientX - lastTap.x) < 30 && Math.abs(t.clientY - lastTap.y) < 30) {
          e.preventDefault();
          toggleZoom(e.target, t.clientX, t.clientY);
          lastTap = null;
        } else {
          lastTap = { t: now, x: t.clientX, y: t.clientY };
        }
      } else {
        lastTap = null;
      }
    }
  }, { passive: false });
})();
</script>

<script id="avito-reviews-arrow-script">
(function(){
  function closest(el, sel){
    while (el && el.nodeType === 1) {
      if (el.matches ? el.matches(sel) : el.msMatchesSelector(sel)) return el;
      el = el.parentNode;
    }
    return null;
  }
  function scrollAmount(scroller){
    var card = scroller.querySelector('.avr-card');
    if (!card) return scroller.clientWidth * 0.8;
    var cs = window.getComputedStyle(scroller);
    var gap = parseFloat(cs.columnGap || cs.gap) || 16;
    return card.getBoundingClientRect().width + gap;
  }
  document.addEventListener('click', function(e){
    var btn = closest(e.target, '.avr-arrow');
    if (!btn) return;
    var scroller = document.getElementById('avr-scroller');
    if (!scroller) return;
    var dir = btn.classList.contains('avr-arrow-left') ? -1 : 1;
    scroller.scrollBy({ left: dir * scrollAmount(scroller), behavior: 'smooth' });
  }, false);
})();
</script>

<script id="design-fix-reviews-scrollbar-script">
(function(){
  var MIN_THUMB = 28;
  var drag = null;

  function els(){
    var s = document.getElementById('avr-scroller');
    var t = document.getElementById('avr-progress-thumb');
    return (s && t) ? { s: s, t: t, track: t.parentNode } : null;
  }

  function sync(){
    var e = els(); if (!e) return;
    var tw = e.track.clientWidth, sw = e.s.scrollWidth, cw = e.s.clientWidth;
    if (!tw || !sw) return;
    if (sw <= cw + 1) { e.track.style.visibility = 'hidden'; return; }
    e.track.style.visibility = '';
    var w = Math.max(tw * cw / sw, MIN_THUMB);
    var max = sw - cw;
    var x = Math.max(0, Math.min(1, e.s.scrollLeft / max)) * (tw - w);
    e.t.style.width = w + 'px';
    e.t.style.transform = 'translateX(' + x + 'px)';
    var wrap = e.s.parentNode;
    var l = wrap && wrap.querySelector('.avr-arrow-left');
    var r = wrap && wrap.querySelector('.avr-arrow-right');
    if (l) l.classList.toggle('avr-arrow--off', e.s.scrollLeft <= 6);
    if (r) r.classList.toggle('avr-arrow--off', e.s.scrollLeft >= max - 6);
  }

  // scroll events don't bubble, but they do reach a capturing listener
  document.addEventListener('scroll', function(ev){
    if (ev.target && ev.target.id === 'avr-scroller') sync();
  }, true);
  window.addEventListener('resize', sync);
  window.addEventListener('load', sync);
  // the section is rendered by the page script after load - keep syncing
  // briefly until it exists and its fonts/layout have settled
  var n = 0, iv = setInterval(function(){ sync(); if (++n > 40) clearInterval(iv); }, 250);

  function moveTo(clientX){
    var d = drag;
    var p = (clientX - d.left - d.grab) / Math.max(1, d.width - d.w);
    p = Math.max(0, Math.min(1, p));
    d.s.scrollLeft = p * d.max;
  }

  document.addEventListener('pointerdown', function(ev){
    var track = ev.target && ev.target.closest ? ev.target.closest('.avr-progress') : null;
    if (!track) return;
    var e = els(); if (!e) return;
    ev.preventDefault();
    var r = track.getBoundingClientRect();
    var tr = e.t.getBoundingClientRect();
    var onThumb = ev.clientX >= tr.left && ev.clientX <= tr.right;
    drag = {
      track: track, s: e.s, left: r.left, width: r.width, w: tr.width,
      max: e.s.scrollWidth - e.s.clientWidth,
      grab: onThumb ? (ev.clientX - tr.left) : tr.width / 2
    };
    track.classList.add('is-dragging');
    e.s.style.scrollSnapType = 'none';   // snapping would fight the drag
    moveTo(ev.clientX);
    try { track.setPointerCapture(ev.pointerId); } catch (_) {}
  });
  document.addEventListener('pointermove', function(ev){
    if (drag) { ev.preventDefault(); moveTo(ev.clientX); }
  });
  function end(){
    if (!drag) return;
    drag.track.classList.remove('is-dragging');
    drag.s.style.scrollSnapType = '';    // settle on the nearest card
    drag = null;
  }
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', end);
})();

@media (max-width: 767.98px){

#reviews::before, #sec-benefits::before, #sec-exam::before, #sec-certs::before, #sec-lessons::before, #sec-cta::before{
  content: "";
  position: absolute;
  left: 50%; top: 0;
  transform: translateX(-50%);
  width: min(640px, 78%); height: 1px;
  pointer-events: none;
  background: linear-gradient(to right, rgba(193,123,108,0), rgba(193,123,108,.38) 50%, rgba(193,123,108,0));

/* ===== Hero: "онлайн" + a live-status dot in the site's colours (terracotta ->
   gold, like the main button) with a soft pulse instead of a stock green dot. ===== */
#hero-online > span{
  display: inline-flex !important;
  align-items: center;
  gap: 10px;
}
.online-dot{
  position: relative;
  flex: none;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: linear-gradient(135deg, #D4AF7A, #C17B6C);
  box-shadow: 0 0 0 3px rgba(212,175,122,.18);
}
.online-dot::after{
  content: "";
  position: absolute; inset: 0;
  border-radius: 50%;
  background: rgba(193,123,108,.5);
  animation: online-pulse 2.4s ease-out infinite;
}
@keyframes online-pulse{
  0%   { transform: scale(1);   opacity: .75; }
  70%  { transform: scale(3);   opacity: 0; }
  100% { transform: scale(3);   opacity: 0; }
}
@media (prefers-reduced-motion: reduce){ .online-dot::after{ animation: none; } }
/* variant 3: thin lines either side */
#hero-online > span{
  font-size: 12px !important;
  letter-spacing: .4em !important;
  font-weight: 500 !important;
  color: #A55646 !important;

}

#hero-online > span::after{
  content: "";

}

#hero-online > span::after{ margin-left: -.4em; background: linear-gradient(to left, rgba(193,123,108,0), rgba(193,123,108,.6)); }
/* ===== Cards "jumping" / flashing as they appear (benefits, certificates,
   lessons) and the buttons' hover: the page animates these elements itself
   (fade + slide), but they also had a blanket CSS "transition: all .3s", so
   every animation frame restarted a CSS transition. The card lagged behind:
   it faded in while still sitting low, then snapped up at the end. Keep CSS
   transitions only for shadow/colour; motion is left to the animation. ===== */
div[class="group relative bg-white p-8 rounded-2xl shadow-lg hover:shadow-2xl transition-all duration-300"],
div[class="group relative bg-white rounded-3xl shadow-lg hover:shadow-2xl transition-all duration-300 overflow-hidden cursor-pointer"],
button[class="group relative px-6 sm:px-8 md:px-10 py-3 sm:py-4 md:py-5 text-white rounded-full overflow-hidden transition-all duration-300 shadow-lg hover:shadow-xl w-full sm:w-auto text-sm sm:text-base md:text-lg font-medium tracking-wide"],
button[class="group relative px-12 py-6 text-white rounded-full overflow-hidden transition-all duration-300 shadow-xl hover:shadow-2xl"],
a[class="flex items-center gap-4 p-4 bg-green-50 rounded-2xl hover:bg-green-100 transition-all duration-300 group cursor-pointer"],
a[class="flex items-center gap-4 p-4 bg-blue-50 rounded-2xl hover:bg-blue-100 transition-all duration-300 group cursor-pointer"]{

/* ===== Phones/tablets have no mouse, so a tap leaves an element "hovered":
   certificate/lesson photos zoomed in and darkened with a magnifier, cards got

   hover-only effects off there (desktop keeps them). ===== */
@media (hover: none){

    transform: none !important;

    transform: none !important;

  div[class="group relative bg-white rounded-3xl shadow-lg hover:shadow-2xl transition-all duration-300 overflow-hidden cursor-pointer"]:hover div[class="relative overflow-hidden rounded-3xl aspect-[4/3]"]::before{
    background: rgba(42,42,42,0) !important;

  div[class="group relative bg-white rounded-3xl shadow-lg hover:shadow-2xl transition-all duration-300 overflow-hidden cursor-pointer"]:hover div[class="relative overflow-hidden rounded-3xl aspect-[4/3]"]::after{
    opacity: 0 !important;
  }
  div[class="relative cursor-pointer w-full max-w-none"]{ cursor: default; }
}

<style id="design-v24-photos">
/* ===== Certificate + lesson cards ===== */
/* Rows are centred, so an odd card at the end sits in the middle instead of
   being left alone on the left (2 per row on tablets, 3 on desktop). */
#sec-certs div[class="grid md:grid-cols-2 lg:grid-cols-3 gap-8"],
#sec-lessons div[class="grid md:grid-cols-2 lg:grid-cols-3 gap-8"]{
  display: flex !important;
  flex-wrap: wrap;
  justify-content: center;
  align-items: stretch;
  gap: 32px;
}
#sec-certs div[class="grid md:grid-cols-2 lg:grid-cols-3 gap-8"] > *,
#sec-lessons div[class="grid md:grid-cols-2 lg:grid-cols-3 gap-8"] > *{
  flex: 0 1 100%;
}
@media (max-width: 767.98px){
  #sec-certs div[class="grid md:grid-cols-2 lg:grid-cols-3 gap-8"],
  #sec-lessons div[class="grid md:grid-cols-2 lg:grid-cols-3 gap-8"]{ gap: 24px; }
}
@media (min-width: 768px){
  #sec-certs div[class="grid md:grid-cols-2 lg:grid-cols-3 gap-8"] > *,
  #sec-lessons div[class="grid md:grid-cols-2 lg:grid-cols-3 gap-8"] > *{ flex-basis: calc((100% - 32px) / 2); max-width: calc((100% - 32px) / 2); }
}
@media (min-width: 1024px){
  #sec-certs div[class="grid md:grid-cols-2 lg:grid-cols-3 gap-8"] > *,
  #sec-lessons div[class="grid md:grid-cols-2 lg:grid-cols-3 gap-8"] > *{ flex-basis: calc((100% - 64px) / 3); max-width: calc((100% - 64px) / 3); }
}
/* Certificates are documents: show the whole sheet on a soft paper-coloured
   mat instead of cropping its edges off. Lesson photos keep filling the frame. */
#sec-certs div[class="relative overflow-hidden rounded-3xl aspect-[4/3]"]{
  background: #F2ECE4;
  border-radius: 24px 24px 0 0 !important;
}
#sec-certs div[class="relative overflow-hidden rounded-3xl aspect-[4/3]"] img{
  object-fit: contain !important;
  padding: 5%;
  filter: drop-shadow(0 4px 10px rgba(74,44,20,.12));
}
#sec-lessons div[class="relative overflow-hidden rounded-3xl aspect-[4/3]"]{
  border-radius: 24px 24px 0 0 !important;
}

/* ===== Photo viewer =====
   Photo, caption and arrows form one group centred on the dimmed page:
   on phones the arrows + counter sit right under the photo, on larger
   screens the arrows sit right beside the photo (not at the screen edges). */
html.lbx-lock, html.lbx-lock body{ overflow: hidden !important; }
.lbx{
  position: fixed; inset: 0; z-index: 9999;
  display: none; flex-direction: column; align-items: center; justify-content: center;
  padding: calc(60px + env(safe-area-inset-top, 0px)) 16px calc(18px + env(safe-area-inset-bottom, 0px));
  overflow: hidden; touch-action: none;
  background: rgba(24,19,17,.74);
  -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
  opacity: 0; transition: opacity .22s ease;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  -webkit-tap-highlight-color: transparent;
}
.lbx.is-open{ display: flex; }
.lbx.is-visible{ opacity: 1; }
.lbx-stage{ position: relative; flex: 0 1 auto; min-height: 0; display: flex; justify-content: center; touch-action: none; }
.lbx-frame{ display: flex; align-items: center; justify-content: center; gap: 18px; }
.lbx-img{
  display: block;
  max-width: calc(100vw - 32px);
  max-height: calc(100vh - 230px); max-height: calc(100svh - 230px);
  object-fit: contain; border-radius: 12px;
  box-shadow: 0 18px 50px rgba(0,0,0,.35);
  background: #fff;
  transform-origin: center center;
  transition: transform .18s ease, opacity .2s ease;
  opacity: 0; user-select: none; -webkit-user-select: none; -webkit-user-drag: none;
  cursor: zoom-in; position: relative; z-index: 1;
}
.lbx-img.is-ready{ opacity: 1; }
.lbx.is-zoomed .lbx-img{ cursor: grab; transition: opacity .2s ease; }
.lbx.is-visible .lbx-img{ animation: lbx-in .24s ease; }
@keyframes lbx-in{ from{ transform: scale(.97); } to{ transform: scale(1); } }
.lbx-bar{
  flex: none; display: flex; flex-direction: column; align-items: center; gap: 10px;
  margin-top: 14px; max-width: 640px; position: relative; z-index: 2;
}
.lbx-cap{ text-align: center; color: rgba(255,255,255,.92); font-size: 15px; line-height: 1.4; }
.lbx-cap:empty{ display: none; }
.lbx-nav{ display: flex; align-items: center; gap: 18px; }
.lbx-count{ min-width: 48px; text-align: center; color: rgba(255,255,255,.7); font-size: 14px; letter-spacing: .04em; }
.lbx-btn{
  flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.22);
  background: rgba(255,255,255,.12); color: #fff; cursor: pointer; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  transition: background-color .2s ease, opacity .2s ease; position: relative; z-index: 2;
}
.lbx-btn:hover{ background: rgba(255,255,255,.24); }
.lbx-btn:focus{ outline: none; }
.lbx-btn:focus-visible{ outline: 2px solid rgba(255,255,255,.75); outline-offset: 2px; }
.lbx-btn:disabled{ opacity: .3; cursor: default; }
.lbx-close{ position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 3; }
.lbx-side{ display: none; }
.lbx.lbx-single .lbx-nav, .lbx.lbx-single .lbx-side{ display: none !important; }
.lbx.is-zoomed .lbx-bar, .lbx.is-zoomed .lbx-side{ opacity: .35; }
@media (min-width: 768px){
  .lbx{ padding: 72px 24px 24px; }
  .lbx-close{ top: 20px; right: 20px; }
  .lbx-side{ display: inline-flex; width: 52px; height: 52px; }
  .lbx-below{ display: none; }
  .lbx-img{
    max-width: min(1100px, calc(100vw - 196px));
    max-height: calc(100vh - 170px); max-height: calc(100svh - 170px);
  }
}
@media (prefers-reduced-motion: reduce){ .lbx, .lbx-img{ transition: none; animation: none; } }

</style>
<script id="design-v24-lightbox">
(function(){
  /* Photo viewer for the certificate + lesson cards.
     Replaces the page's own full-screen viewer: the site stays visible (dimmed)
     behind the photo, a tap/click outside the photo closes it, arrows / swipe /
     keyboard move between the photos of the same block, and zoom works with
     pinch, double-tap/double-click, mouse wheel, and drag to pan. */
  var CARD = 'div[class="group relative bg-white rounded-3xl shadow-lg hover:shadow-2xl transition-all duration-300 overflow-hidden cursor-pointer"]';
  var ZMIN = 1, ZMAX = 4, ZDBL = 2.5;
  var box, stage, img, cap, cnt, prevB, nextB, closeB;
  var items = [], idx = 0, open = false, lastFocus = null;
  var z = { s: 1, x: 0, y: 0 };
  var ptrs = {}, pinch = null, drag = null, swipe = null, lastTap = 0, lastTapX = 0, lastTapY = 0;

  function build(){
    box = document.createElement('div');
    box.className = 'lbx';
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-modal', 'true');
    box.setAttribute('aria-label', 'Просмотр фото');
    box.innerHTML =
      '<div class="lbx-stage"><div class="lbx-frame">' +
        '<button type="button" class="lbx-btn lbx-prev lbx-side" aria-label="Предыдущее фото"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>' +
        '<img class="lbx-img" alt="" draggable="false">' +
        '<button type="button" class="lbx-btn lbx-next lbx-side" aria-label="Следующее фото"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>' +
      '</div></div>' +
      '<button type="button" class="lbx-btn lbx-close" aria-label="Закрыть">' +
        '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
      '<div class="lbx-bar">' +
        '<div class="lbx-cap"></div>' +
        '<div class="lbx-nav">' +
          '<button type="button" class="lbx-btn lbx-prev lbx-below" aria-label="Предыдущее фото"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>' +
          '<span class="lbx-count"></span>' +
          '<button type="button" class="lbx-btn lbx-next lbx-below" aria-label="Следующее фото"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(box);
    stage = box.querySelector('.lbx-stage');
    img = box.querySelector('.lbx-img');
    cap = box.querySelector('.lbx-cap');
    cnt = box.querySelector('.lbx-count');
    prevB = box.querySelectorAll('.lbx-prev');
    nextB = box.querySelectorAll('.lbx-next');
    closeB = box.querySelector('.lbx-close');
    closeB.addEventListener('click', close);
    Array.prototype.forEach.call(prevB, function(b){ b.addEventListener('click', function(e){ e.stopPropagation(); go(-1); }); });
    Array.prototype.forEach.call(nextB, function(b){ b.addEventListener('click', function(e){ e.stopPropagation(); go(1); }); });
    // a click on the dimmed area (anywhere that isn't the photo or a control) closes
    box.addEventListener('click', function(e){
      var t = e.target;
      if (t === box || t === stage || t.classList.contains('lbx-frame') || t.classList.contains('lbx-bar') || t.classList.contains('lbx-nav')) {
        if (Date.now() - (box._gestureEnd || 0) > 350) close();
      }
    });
    stage.addEventListener('wheel', onWheel, { passive: false });
    img.addEventListener('dblclick', function(e){ e.preventDefault(); toggleZoom(e.clientX, e.clientY); });
    stage.addEventListener('pointerdown', onDown);
    stage.addEventListener('pointermove', onMove);
    stage.addEventListener('pointerup', onUp);
    stage.addEventListener('pointercancel', onUp);
    img.addEventListener('load', function(){ img.classList.add('is-ready'); });
  }

  function collect(card){
    var root = card.closest('section') || document;
    return Array.prototype.map.call(root.querySelectorAll(CARD), function(c){
      var im = c.querySelector('img');
      var t = c.querySelector('h3, p');
      return { src: im ? (im.currentSrc || im.src) : '', title: t ? t.textContent.trim() : (im ? im.alt : '') };
    }).filter(function(it){ return it.src; });
  }

  function show(i){
    idx = Math.max(0, Math.min(items.length - 1, i));
    resetZoom();
    img.classList.remove('is-ready');
    img.src = items[idx].src;
    if (img.complete) img.classList.add('is-ready');
    img.alt = items[idx].title || '';
    cap.textContent = items[idx].title || '';
    var many = items.length > 1;
    box.classList.toggle('lbx-single', !many);
    cnt.textContent = many ? (idx + 1) + ' / ' + items.length : '';
    Array.prototype.forEach.call(prevB, function(b){ b.disabled = idx === 0; });
    Array.prototype.forEach.call(nextB, function(b){ b.disabled = idx === items.length - 1; });
  }

  var viaKey = false;
  document.addEventListener('keydown', function(){ viaKey = true; }, true);
  document.addEventListener('pointerdown', function(){ viaKey = false; }, true);
  function openAt(card){
    if (!box) build();
    items = collect(card);
    var cards = Array.prototype.slice.call((card.closest('section') || document).querySelectorAll(CARD));
    lastFocus = document.activeElement;
    show(Math.max(0, cards.indexOf(card)));
    open = true;
    document.documentElement.classList.add('lbx-lock');
    box.classList.add('is-open');
    requestAnimationFrame(function(){ box.classList.add('is-visible'); });
    if (viaKey) { try { closeB.focus({ preventScroll: true }); } catch (_) {} }
  }

  function close(){
    if (!open) return;
    open = false;
    box.classList.remove('is-visible');
    document.documentElement.classList.remove('lbx-lock');
    setTimeout(function(){ if (!open) { box.classList.remove('is-open'); img.removeAttribute('src'); } }, 220);
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus({ preventScroll: true }); } catch (_) {} }
  }

  function go(d){
    if (!open) return;
    var n = idx + d;
    if (n < 0 || n >= items.length) return;
    show(n);
  }

  /* ---------- zoom / pan ---------- */
  function apply(){
    img.style.transform = 'translate(' + z.x + 'px,' + z.y + 'px) scale(' + z.s + ')';
    box.classList.toggle('is-zoomed', z.s > 1.01);
  }
  function resetZoom(){ z.s = 1; z.x = 0; z.y = 0; img.style.transform = ''; box.classList.remove('is-zoomed'); }
  function clampPan(){
    var w = img.offsetWidth, h = img.offsetHeight;
    var sw = box.clientWidth, sh = box.clientHeight;
    var mx = Math.max(0, (w * z.s - sw) / 2), my = Math.max(0, (h * z.s - sh) / 2);
    // allow panning across the whole photo even if it is smaller than the stage on one axis
    mx = Math.max(mx, (w * z.s - w) / 2); my = Math.max(my, (h * z.s - h) / 2);
    z.x = Math.max(-mx, Math.min(mx, z.x));
    z.y = Math.max(-my, Math.min(my, z.y));
  }
  function zoomTo(s, cx, cy){
    var r = img.getBoundingClientRect();
    var ox = r.left + r.width / 2, oy = r.top + r.height / 2;   // current centre (incl. translate)
    var s0 = z.s, s1 = Math.max(ZMIN, Math.min(ZMAX, s));
    var k = s1 / s0;
    z.x += (cx - ox) * (1 - k);
    z.y += (cy - oy) * (1 - k);
    z.s = s1;
    if (z.s <= 1.01) { resetZoom(); return; }
    clampPan(); apply();
  }
  function toggleZoom(cx, cy){ if (z.s > 1.01) resetZoom(); else zoomTo(ZDBL, cx, cy); }
  function onWheel(e){
    e.preventDefault();
    zoomTo(z.s * Math.exp(-e.deltaY * 0.0018), e.clientX, e.clientY);
  }

  function onDown(e){
    if (e.target.closest('.lbx-btn')) return;
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    var ids = Object.keys(ptrs);
    if (ids.length === 2) {
      var a = ptrs[ids[0]], b = ptrs[ids[1]];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: z.s };
      drag = swipe = null;
    } else if (ids.length === 1) {
      if (z.s > 1.01) drag = { x: e.clientX, y: e.clientY, ox: z.x, oy: z.y, moved: false };
      else swipe = { x: e.clientX, y: e.clientY, t: Date.now(), onImg: e.target === img };
    }
  }
  function onMove(e){
    if (!ptrs[e.pointerId]) return;
    ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = Object.keys(ptrs);
    if (pinch && ids.length === 2) {
      e.preventDefault();
      var a = ptrs[ids[0]], b = ptrs[ids[1]];
      zoomTo(pinch.s * Math.hypot(a.x - b.x, a.y - b.y) / (pinch.d || 1), (a.x + b.x) / 2, (a.y + b.y) / 2);
    } else if (drag) {
      e.preventDefault();
      z.x = drag.ox + (e.clientX - drag.x); z.y = drag.oy + (e.clientY - drag.y);
      if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 6) drag.moved = true;
      clampPan(); apply();
    } else if (swipe) {
      var dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
      if (Math.abs(dx) > 8 || Math.abs(dy) > 8) {
        img.style.transition = 'none';
        if (Math.abs(dx) >= Math.abs(dy)) img.style.transform = 'translateX(' + dx * 0.6 + 'px)';
        else if (dy > 0) img.style.transform = 'translateY(' + dy * 0.6 + 'px)';
      }
    }
  }
  function onUp(e){
    var p = ptrs[e.pointerId]; delete ptrs[e.pointerId];
    var ids = Object.keys(ptrs);
    if (pinch && ids.length < 2) { pinch = null; box._gestureEnd = Date.now(); return; }
    if (drag) { var moved = drag.moved; drag = null; if (moved) { box._gestureEnd = Date.now(); return; } }
    if (swipe && p) {
      var dx = p.x - swipe.x, dy = p.y - swipe.y, s = swipe; swipe = null;
      img.style.transition = ''; img.style.transform = '';
      if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.2) { box._gestureEnd = Date.now(); go(dx < 0 ? 1 : -1); return; }
      if (dy > 90 && dy > Math.abs(dx) * 1.2) { box._gestureEnd = Date.now(); close(); return; }
      // double-tap on the photo toggles zoom (touch)
      if (e.pointerType === 'touch' && s.onImg && Math.abs(dx) < 10 && Math.abs(dy) < 10) {
        var now = Date.now();
        if (now - lastTap < 320 && Math.abs(p.x - lastTapX) < 30 && Math.abs(p.y - lastTapY) < 30) {
          toggleZoom(p.x, p.y); lastTap = 0; box._gestureEnd = now;
        } else { lastTap = now; lastTapX = p.x; lastTapY = p.y; }
      }
    }
  }

  document.addEventListener('keydown', function(e){
    if (!open) return;
    if (e.key === 'Escape') { e.preventDefault(); close(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
  });

  // Open from the cards. Capture phase + stopPropagation, so the page's own
  // full-screen viewer never opens underneath.
  document.addEventListener('click', function(e){
    var card = e.target && e.target.closest ? e.target.closest(CARD) : null;
    if (!card) return;
    e.stopPropagation();
    e.preventDefault();
    openAt(card);
  }, true);
})();

</script>

/* ===== Warm card shadows (beige-brown instead of grey) ===== */
div[class="group relative bg-white p-8 rounded-2xl shadow-lg hover:shadow-2xl transition-all duration-300"],
div[class="group relative bg-white rounded-3xl shadow-lg hover:shadow-2xl transition-all duration-300 overflow-hidden cursor-pointer"],
div[class="relative bg-white p-6 rounded-2xl shadow-lg"],
div[class="relative rounded-2xl overflow-hidden shadow-lg"]{
  box-shadow: 0 12px 28px -10px rgba(122,74,52,.20), 0 3px 10px -4px rgba(122,74,52,.12) !important;
}
@media (hover: hover){
  div[class="group relative bg-white p-8 rounded-2xl shadow-lg hover:shadow-2xl transition-all duration-300"]:hover,
  div[class="group relative bg-white rounded-3xl shadow-lg hover:shadow-2xl transition-all duration-300 overflow-hidden cursor-pointer"]:hover{
    box-shadow: 0 26px 50px -16px rgba(122,74,52,.30), 0 6px 16px -6px rgba(122,74,52,.14) !important;
  }
}
@media (hover: none){
  div[class="group relative bg-white p-8 rounded-2xl shadow-lg hover:shadow-2xl transition-all duration-300"]:hover,
  div[class="group relative bg-white rounded-3xl shadow-lg hover:shadow-2xl transition-all duration-300 overflow-hidden cursor-pointer"]:hover{
    box-shadow: 0 12px 28px -10px rgba(122,74,52,.20), 0 3px 10px -4px rgba(122,74,52,.12) !important;
  }
}
.avr-card{ box-shadow: 0 10px 24px -12px rgba(122,74,52,.16); }

/* ===== Light sweep across the main buttons every few seconds ===== */
.hero-cta-wrap button, #sec-cta button{ position: relative; }
.hero-cta-wrap button::after, #sec-cta button::after{
  content: ""; position: absolute; top: -20%; bottom: -20%; left: 0; width: 40%; z-index: 5; pointer-events: none;
  background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.5), rgba(255,255,255,0));
  transform: translateX(-130%) skewX(-18deg);
  animation: btn-shine 6s ease-in-out 1.4s infinite;
}
@keyframes btn-shine{
  0%{ transform: translateX(-130%) skewX(-18deg); }
  18%{ transform: translateX(260%) skewX(-18deg); }
  100%{ transform: translateX(260%) skewX(-18deg); }
}

/* ===== Dividers draw themselves from the centre when they scroll into view ===== */
#reviews::before, #sec-benefits::before, #sec-exam::before, #sec-certs::before, #sec-lessons::before, #sec-cta::before, #site-footer-addon.ft::before{
  transform-origin: center;
  transition: transform 1.1s cubic-bezier(.3,.7,.2,1);
}
[data-seam="wait"]::before{ transform: translateX(-50%) scaleX(0) !important; }

@media (prefers-reduced-motion: reduce){
  .hero-cta-wrap button::after, #sec-cta button::after{ animation: none; display: none; }
  [data-seam="wait"]::before{ transform: translateX(-50%) !important; }
}

(function(){
  /* Divider lines: hide the ones still below the screen, draw each when it

  var IDS = ['reviews','sec-benefits','sec-exam','sec-certs','sec-lessons','sec-cta','site-footer-addon'];
  var io = ('IntersectionObserver' in window) ? new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if (e.isIntersecting) { e.target.removeAttribute('data-seam'); io.unobserve(e.target); }

  var done = {};

    IDS.forEach(function(id){
      if (done[id]) return;
      var el = document.getElementById(id);
      if (!el) { all = false; return; }
      done[id] = true;
      if (el.getBoundingClientRect().top > window.innerHeight * 0.9) {
        el.setAttribute('data-seam', 'wait');
        io.observe(el);
      }
    });
    return all;
  }
  var n = 0, t = setInterval(function(){ if (setup() || ++n > 60) clearInterval(t); }, 200);
})();

<script id="design-v30-lightbox-close">
(function(){
  var GAP = 10, SIZE = 44;
  function place(box){
    var img = box.querySelector('.lbx-img'), btn = box.querySelector('.lbx-close');
    if (!img || !btn || !box.classList.contains('is-open')) return;
    if (box.classList.contains('is-zoomed')) return;          // keep it where it was while zoomed
    var r = img.getBoundingClientRect();
    if (!r.width || !r.height) return;
    var top = Math.max(8, r.top - SIZE - GAP);
    var left = Math.min(window.innerWidth - SIZE - 8, Math.max(8, r.right - SIZE));
    btn.style.top = top + 'px';
    btn.style.left = left + 'px';
    btn.classList.add('is-placed');
  }
  function hook(box){
    if (box.__closeHooked) return; box.__closeHooked = true;
    var img = box.querySelector('.lbx-img');
    var later = function(){ place(box); setTimeout(function(){ place(box); }, 280); };
    if (img) img.addEventListener('load', later);
    new MutationObserver(function(){
      if (!box.classList.contains('is-open')) { var b = box.querySelector('.lbx-close'); if (b) b.classList.remove('is-placed'); return; }
      later();
    }).observe(box, { attributes: true, attributeFilter: ['class'] });
    if (img) new MutationObserver(later).observe(img, { attributes: true, attributeFilter: ['src', 'class'] });
    window.addEventListener('resize', function(){ place(box); });
    later();
  }
  function find(){ var b = document.querySelector('.lbx'); if (b) hook(b); return !!b; }
  if (!find()) {
    var mo = new MutationObserver(function(){ if (find()) mo.disconnect(); });
    mo.observe(document.documentElement, { childList: true, subtree: true });
  }
})();
</script>
<script id="design-v31-edu-speed">
/* «Образование и опыт» on desktop: the page animates this block with the browser's
   own animation engine (heading and photo 0.8s, list items 0.6s each, staggered -
   about 1.3s in total). Play exactly those animations 1.5x faster (delays included),
   so the same motion finishes in ~0.85s. Phones/tablets unchanged. */
(function(){
  var RATE = 1.5, mq = window.matchMedia ? window.matchMedia('(min-width: 1024px)') : null;
  var orig = Element.prototype.animate;
  if (!orig || !mq) return;
  Element.prototype.animate = function(){
    var a = orig.apply(this, arguments);
    try { if (mq.matches && a && this.closest && this.closest('#sec-edu')) a.playbackRate = RATE; } catch (e) {}
    return a;
  };
})();
</script>

<script id="fab-overlap-fix-script">
(function(){
  function init(){
    var fab = document.querySelector('.fixed.bottom-24.right-4');
    if(!fab) return;
    var ctaTexts = ['\u0417\u0430\u043f\u0438\u0441\u0430\u0442\u044c\u0441\u044f \u043d\u0430 \u0437\u0430\u043d\u044f\u0442\u0438\u0435','\u041d\u0430\u043f\u0438\u0441\u0430\u0442\u044c \u0438 \u0437\u0430\u043f\u0438\u0441\u0430\u0442\u044c\u0441\u044f'];
    function important(){
      var list = Array.prototype.slice.call(document.querySelectorAll('h1,h2'));
      Array.prototype.forEach.call(document.querySelectorAll('a,button'), function(el){
        var t = el.textContent && el.textContent.trim();
        if(ctaTexts.indexOf(t) !== -1) list.push(el);
      });
      var footer = document.getElementById('site-footer-addon');
      if(footer) list.push(footer);
      return list;
    }
    var targets = important();

    function rectsOverlap(a,b,pad){
      pad = pad||0;
      return !(b.left > a.right+pad || b.right < a.left-pad || b.top > a.bottom+pad || b.bottom < a.top-pad);
    }

    var ticking = false;
    function check(){
      ticking = false;
      var fr = fab.getBoundingClientRect();
      if(fr.width === 0){ return; }
      var overlap = targets.some(function(el){
        var r = el.getBoundingClientRect();
        if(r.width===0 || r.height===0) return false;
        return rectsOverlap(fr, r, 6);
      });
      fab.classList.toggle('fab-auto-hidden', overlap);
    }
    function onScroll(){
      if(!ticking){ ticking = true; requestAnimationFrame(check); }
    }
    window.addEventListener('scroll', onScroll, {passive:true});
    window.addEventListener('resize', onScroll);
    check();
  }
  if(document.readyState === 'complete'){ setTimeout(init, 300); }
  else { window.addEventListener('load', function(){ setTimeout(init, 300); }); }
})();
</script>
<script id="design-flourish-1-script">
(function(){
  function init(){
    var candidates = Array.prototype.slice.call(document.querySelectorAll('div,p,span'));
    var target = candidates.find(function(el){
      return el.children.length === 0 && el.textContent.indexOf('Более 7 лет провожу') !== -1;
    });
    if(!target) return;
    var full = target.textContent;
    var idx = full.indexOf('7');
    if(idx === -1) return;
    var before = full.slice(0, idx);
    var after = full.slice(idx + 1);
    while(target.firstChild) target.removeChild(target.firstChild);
    target.appendChild(document.createTextNode(before));
    var numSpan = document.createElement('span');
    numSpan.className = 'stat-num-7';
    numSpan.textContent = '0';
    target.appendChild(numSpan);
    target.appendChild(document.createTextNode(after));

    var animated = false;
    function animate(){
      if(animated) return;
      animated = true;
      var start = null;
      var duration = 900;
      function step(ts){
        if(!start) start = ts;
        var progress = Math.min((ts - start) / duration, 1);
        var val = Math.round(progress * 7);
        numSpan.textContent = String(val);
        if(progress < 1){
          requestAnimationFrame(step);
        } else {
          numSpan.textContent = '7';
          numSpan.classList.add('stat-num-7--done');
          setTimeout(function(){ numSpan.classList.remove('stat-num-7--done'); }, 250);
        }
      }
      requestAnimationFrame(step);
    }

    if('IntersectionObserver' in window){
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(e){ if(e.isIntersecting) animate(); });
      }, { threshold: 0.4 });
      io.observe(target);
    } else {
      numSpan.textContent = '7';
    }
  }
  if(document.readyState === 'complete'){ setTimeout(init, 300); }
  else { window.addEventListener('load', function(){ setTimeout(init, 300); }); }
})();
</script>
